<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>APIKEY Encryptor</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap');

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0d0f14;
      --surface: #151820;
      --border: #252a38;
      --accent: #4ade80;
      --accent2: #22d3ee;
      --text: #e2e8f0;
      --muted: #64748b;
      --danger: #f87171;
    }

    body {
      font-family: 'Noto Sans JP', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 32px;
      width: 100%;
      max-width: 520px;
      position: relative;
      overflow: hidden;
    }

    .card::before {
      content: '';
      position: absolute;
      top: -80px; right: -80px;
      width: 200px; height: 200px;
      background: radial-gradient(circle, rgba(74,222,128,0.08) 0%, transparent 70%);
      pointer-events: none;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(74,222,128,0.1);
      border: 1px solid rgba(74,222,128,0.3);
      color: var(--accent);
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 20px;
      margin-bottom: 16px;
      letter-spacing: 0.05em;
    }

    h1 {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 6px;
      letter-spacing: -0.02em;
    }

    .subtitle {
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 28px;
      line-height: 1.6;
    }

    .field { margin-bottom: 20px; }

    label {
      display: block;
      font-size: 12px;
      font-weight: 500;
      color: var(--muted);
      margin-bottom: 6px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    input, textarea {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      padding: 12px 14px;
      outline: none;
      transition: border-color 0.2s;
    }
    input:focus, textarea:focus {
      border-color: var(--accent);
    }
    textarea { resize: vertical; min-height: 80px; }

    .btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      font-family: 'Noto Sans JP', sans-serif;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
      margin-bottom: 12px;
    }
    .btn-primary {
      background: linear-gradient(135deg, var(--accent) 0%, #16a34a 100%);
      color: #0d1a0d;
    }
    .btn-primary:hover { filter: brightness(1.1); transform: translateY(-1px); }
    .btn-secondary {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
    }
    .btn-secondary:hover { border-color: var(--accent2); color: var(--accent2); }

    .result-block {
      display: none;
      margin-top: 20px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 16px;
    }
    .result-block.show { display: block; }
    .result-label {
      font-size: 11px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 8px;
    }
    .result-value {
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      color: var(--accent);
      word-break: break-all;
      line-height: 1.6;
    }
    .copy-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 10px;
      padding: 6px 14px;
      background: rgba(34,211,238,0.1);
      border: 1px solid rgba(34,211,238,0.3);
      border-radius: 6px;
      color: var(--accent2);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .copy-btn:hover { background: rgba(34,211,238,0.2); }

    .info-box {
      background: rgba(248,113,113,0.07);
      border: 1px solid rgba(248,113,113,0.2);
      border-radius: 8px;
      padding: 12px 14px;
      font-size: 12px;
      color: #fca5a5;
      line-height: 1.7;
      margin-top: 20px;
    }
    .info-box strong { color: var(--danger); }
  </style>
</head>
<body>
<div class="card">
  <div class="badge">🔐 ENCRYPT TOOL</div>
  <h1>APIKEY 暗号化ツール</h1>
  <p class="subtitle">SSH Manager に埋め込む暗号化済み APIKEY を生成します。<br>生成した文字列を SSH Manager の ENCRYPTED_KEY に貼り付けてください。</p>

  <div class="field">
    <label>平文 APIKEY</label>
    <input type="password" id="raw-key" placeholder="your-actual-api-key-here" autocomplete="off">
  </div>

  <div class="field">
    <label>復号パスワード（起動時に入力するもの）</label>
    <input type="password" id="password" placeholder="任意のパスワード" autocomplete="off">
  </div>

  <button class="btn btn-primary" onclick="encrypt()">🔒 暗号化して生成</button>

  <div class="result-block" id="result-block">
    <div class="result-label">生成された暗号文（ENCRYPTED_KEY に貼り付け）</div>
    <div class="result-value" id="result-value"></div>
    <button class="copy-btn" onclick="copyResult()">📋 コピー</button>
  </div>

  <div class="info-box">
    <strong>⚠ セキュリティ注意</strong><br>
    暗号文はソースに埋め込まれますが、パスワードを知らないと復号できません。<br>
    パスワードを忘れると復元不可能です。安全な場所に保管してください。
  </div>
</div>

<script>
async function encrypt() {
  const raw = document.getElementById('raw-key').value.trim();
  const pass = document.getElementById('password').value;

  if (!raw || !pass) return alert('APIKEY とパスワードの両方を入力してください');

  const enc = new TextEncoder();
  const keyMaterial = await crypto.subtle.importKey(
    'raw', enc.encode(pass), 'PBKDF2', false, ['deriveKey']
  );
  const salt = crypto.getRandomValues(new Uint8Array(16));
  const iv   = crypto.getRandomValues(new Uint8Array(12));
  const key  = await crypto.subtle.deriveKey(
    { name: 'PBKDF2', salt, iterations: 200000, hash: 'SHA-256' },
    keyMaterial,
    { name: 'AES-GCM', length: 256 },
    false, ['encrypt']
  );
  const cipherBuf = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, enc.encode(raw));

  // salt(16) + iv(12) + cipher を結合してBase64
  const combined = new Uint8Array(salt.length + iv.length + cipherBuf.byteLength);
  combined.set(salt, 0);
  combined.set(iv, 16);
  combined.set(new Uint8Array(cipherBuf), 28);

  const b64 = btoa(String.fromCharCode(...combined));
  document.getElementById('result-value').textContent = b64;
  document.getElementById('result-block').classList.add('show');
}

function copyResult() {
  const val = document.getElementById('result-value').textContent;
  navigator.clipboard.writeText(val).then(() => {
    const btn = document.querySelector('.copy-btn');
    btn.textContent = '✅ コピーしました';
    setTimeout(() => { btn.textContent = '📋 コピー'; }, 2000);
  });
}
</script>
</body>
</html>
